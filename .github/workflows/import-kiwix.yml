name: Build Hebrew ZIM Reader

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Build standalone ZIM reader')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download official Kiwix JS source
        run: git clone --depth 1 https://github.com/kiwix/kiwix-js.git /tmp/kiwix-js

      - name: Apply Hebrew interface to upstream source
        run: |
          cp .custom/he.jsonp.js /tmp/kiwix-js/i18n/he.jsonp.js
          cp .custom/custom.css /tmp/kiwix-js/www/css/custom.css
          cd /tmp/kiwix-js
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          edit('www/index.html', [
              ('<html>', '<html lang="he" dir="rtl">'),
              ('<title>Kiwix</title>', '<title>קורא ZIM</title>'),
              ('<meta name="description" content="Offline Wikipedia reader">', '<meta name="description" content="קורא עצמאי לארכיוני ZIM">'),
              ('<a id="appVersion" class="navbar-brand">Kiwix</a>', '<a id="appVersion" class="navbar-brand">קורא ZIM</a>'),
              ('<option class="dropdown-item" href="#" value="en">English</a>', '<option class="dropdown-item" href="#" value="en">English</a>\n                                <option class="dropdown-item" value="he">עברית</option>'),
              ('    </head>', '        <link rel="stylesheet" href="css/custom.css"/>\n    </head>')
          ])
          edit('www/js/init.js', [
              ("params['overrideBrowserLanguage'] = getSetting('languageOverride');", "params['overrideBrowserLanguage'] = getSetting('languageOverride') || 'he';")
          ])
          edit('www/js/app.js', [
              ('/^(?:en|es|fr)$/.test(defaultBrowserLanguage.base)', '/^(?:en|es|fr|he)$/.test(defaultBrowserLanguage.base)')
          ])
          edit('www/js/lib/translateUI.js', [
              ("return util.getJSONPObject('../i18n/' + langCode + '.jsonp.js')", "var translationDir = window.location.pathname.indexOf('/www/') >= 0 ? '../i18n/' : 'i18n/';\n    return util.getJSONPObject(translationDir + langCode + '.jsonp.js')")
          ])
          edit('service-worker.js', [
              ("'i18n/fr.jsonp.js',", "'i18n/fr.jsonp.js', 'i18n/he.jsonp.js',"),
              ("'www/css/transition.css',", "'www/css/transition.css', 'www/css/custom.css', 'css/custom.css',")
          ])
          edit('manifest.webmanifest', [
              ('"name": "Kiwix JS Browser Extension"', '"name": "קורא ZIM"'),
              ('"short_name": "Kiwix JS"', '"short_name": "ZIM"'),
              ('"lang": "en-GB"', '"lang": "he"'),
              ('"background_color": "#000"', '"background_color": "#f5f7fa"'),
              ('"description": "Kiwix is an offline reader for content from Wikipedia, Project Gutenberg, TED Talks, Wikivoyage, Stackexchange, and many other Web archives. It makes knowledge available to people with limited or no Internet access."', '"description": "קורא עצמאי לארכיוני ZIM עם ממשק עברי."')
          ])
          PY

      - name: Build the standalone app
        working-directory: /tmp/kiwix-js
        run: |
          npm ci
          npm run build-min

      - name: Keep only deployable files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .custom ! -name README-LOCAL.md -exec rm -rf {} +
          mkdir -p www
          cp -a /tmp/kiwix-js/dist/www/. ./
          cp -a /tmp/kiwix-js/dist/www/. ./www/
          cp -a /tmp/kiwix-js/dist/i18n ./i18n
          cp -f /tmp/kiwix-js/dist/service-worker.js ./service-worker.js
          cp -f /tmp/kiwix-js/dist/manifest.webmanifest ./manifest.webmanifest
          cp -f /tmp/kiwix-js/dist/manifest.json ./manifest.json
          cp -f /tmp/kiwix-js/dist/replayWorker.js ./replayWorker.js
          cp -f /tmp/kiwix-js/dist/LICENSE-GPLv3.txt ./LICENSE-GPLv3.txt
          cp README-LOCAL.md README.md
          rm README-LOCAL.md

      - name: Commit deployable app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build standalone ZIM reader"
            git push
          fi

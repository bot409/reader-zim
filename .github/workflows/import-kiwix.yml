name: Import and build Kiwix JS

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-kiwix.yml"

permissions:
  contents: write

jobs:
  import-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download official Kiwix JS source
        run: |
          git clone --depth 1 https://github.com/kiwix/kiwix-js.git /tmp/kiwix-js
          rsync -a --delete --exclude='.git' --exclude='.github/' --exclude='.custom/' /tmp/kiwix-js/ ./

      - name: Apply local Hebrew interface
        run: |
          cp .custom/he.jsonp.js i18n/he.jsonp.js
          cp .custom/custom.css www/css/custom.css
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          edit('www/index.html', [
              ('<html>', '<html lang="he" dir="rtl">'),
              ('<a id="appVersion" class="navbar-brand">Kiwix</a>', '<a id="appVersion" class="navbar-brand">קורא ZIM</a>'),
              ('<option class="dropdown-item" href="#" value="en">English</a>', '<option class="dropdown-item" href="#" value="en">English</a>\n                                <option class="dropdown-item" value="he">עברית</option>'),
              ('    </head>', '        <link rel="stylesheet" href="css/custom.css"/>\n    </head>')
          ])
          edit('www/js/init.js', [
              ("params['overrideBrowserLanguage'] = getSetting('languageOverride');", "params['overrideBrowserLanguage'] = getSetting('languageOverride') || 'he';")
          ])
          edit('www/js/app.js', [
              ('/^(?:en|es|fr)$/.test(defaultBrowserLanguage.base)', '/^(?:en|es|fr|he)$/.test(defaultBrowserLanguage.base)')
          ])
          edit('www/js/lib/translateUI.js', [
              ("return util.getJSONPObject('../i18n/' + langCode + '.jsonp.js')", "var translationDir = window.location.pathname.indexOf('/www/') >= 0 ? '../i18n/' : 'i18n/';\\n    return util.getJSONPObject(translationDir + langCode + '.jsonp.js')")
          ])
          edit('service-worker.js', [
              ("'i18n/fr.jsonp.js',", "'i18n/fr.jsonp.js', 'i18n/he.jsonp.js',")
          ])
          PY

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build-min

      - name: Publish standalone site files to repository root
        run: |
          cp -a dist/www/. ./
          cp -a dist/i18n ./i18n
          cp -f dist/service-worker.js ./service-worker.js
          cp -f dist/manifest.webmanifest ./manifest.webmanifest
          cp -f dist/LICENSE-GPLv3.txt ./LICENSE-GPLv3.txt
          cat > README-LOCAL.md <<'EOF'
          # Kiwix JS - local project copy

          This repository contains a self-hosted build of the official Kiwix JS project.
          Upstream source: https://github.com/kiwix/kiwix-js
          Upstream license: GNU GPL v3 (see LICENSE-GPLv3.txt).

          The site is built from the upstream source by GitHub Actions. ZIM archives are selected locally in the browser; they are not uploaded to this repository.
          EOF

      - name: Commit imported source and built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import and build official Kiwix JS"
            git push
          fi
